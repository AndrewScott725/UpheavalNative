name: Build Upheaval Windows Native Crowd

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Upheaval
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SCons
        run: python -m pip install scons

      - name: Clone godot-cpp
        shell: bash
        working-directory: native/crowd_gdextension
        run: |
          git clone --depth 1 https://github.com/godotengine/godot-cpp.git godot-cpp

      - name: Build Windows Debug
        working-directory: native/crowd_gdextension
        run: scons platform=windows arch=x86_64 target=template_debug api_version=4.7

      - name: Build Windows Release
        working-directory: native/crowd_gdextension
        run: scons platform=windows arch=x86_64 target=template_release api_version=4.7

      - name: Show built files
        shell: bash
        working-directory: native/crowd_gdextension
        run: find bin -maxdepth 1 -type f -print

      - name: Upload Windows DLLs
        uses: actions/upload-artifact@v4
        with:
          name: upheaval-windows-native
          path: native/crowd_gdextension/bin/*
